<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Live</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: #141420;
      border-bottom: 1px solid #252540;
      flex-shrink: 0;
    }
    .gem-logo {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: conic-gradient(#4285f4 0%, #ea4335 33%, #fbbc05 66%, #34a853 100%);
      flex-shrink: 0;
    }
    header h1 { font-size: 17px; font-weight: 600; color: #fff; }
    .model-tag {
      font-size: 11px;
      color: #6a6a8a;
      background: #1e1e30;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 4px;
    }

    /* status pill */
    .status-pill {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #999;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #555;
      transition: background .3s;
      flex-shrink: 0;
    }
    .dot.connecting { background: #f5a623; animation: blink 1s infinite; }
    .dot.connected  { background: #34a853; box-shadow: 0 0 6px #34a853; }
    .dot.error      { background: #ea4335; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ── Chat area ─────────────────────────────────── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    #chat::-webkit-scrollbar { width: 5px; }
    #chat::-webkit-scrollbar-thumb { background: #2a2a40; border-radius: 4px; }

    /* ── Sign panel ───────────────────────────────── */
    #sign-panel {
      padding: 10px 16px;
      border-bottom: 1px solid #252540;
      background: #111126;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 12px;
      align-items: start;
      flex-shrink: 0;
    }
    #cam-video {
      width: 220px;
      height: 160px;
      border-radius: 10px;
      background: #090916;
      border: 1px solid #252540;
      object-fit: cover;
    }
    .sign-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .sign-btn {
      border: 1px solid #2f3a6a;
      background: #1a2550;
      color: #dbe4ff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .sign-btn:disabled { opacity: .5; cursor: not-allowed; }
    .sign-text { font-size: 13px; color: #b8c0e8; line-height: 1.45; }
    .sign-text b { color: #fff; }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 78%;
      animation: fadeUp .2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user  { align-self: flex-end; flex-direction: row-reverse; }
    .msg.gemini{ align-self: flex-start; }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      margin-top: 2px;
    }
    .msg.user   .avatar { background: #1a237e; color: #7c8cf8; }
    .msg.gemini .avatar {
      background: conic-gradient(#4285f4 0%, #ea4335 33%, #fbbc05 66%, #34a853 100%);
      color: #fff;
    }

    .bubble {
      background: #1b1b2e;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 14.5px;
      line-height: 1.55;
      min-width: 48px;
      word-break: break-word;
    }
    .msg.user   .bubble { background: #1a237e; border-radius: 14px 4px 14px 14px; }
    .msg.gemini .bubble { border-radius: 4px 14px 14px 14px; }

    /* typing dots */
    .typing { display: flex; gap: 4px; padding: 4px 2px; }
    .typing span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #555;
      animation: tdot 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes tdot { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

    /* audio indicator */
    .audio-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,.07);
      font-size: 12px;
      color: #888;
    }
    .audio-row .icon { font-size: 15px; }
    .waves { display: flex; align-items: center; gap: 2px; height: 16px; }
    .waves span {
      display: inline-block;
      width: 3px;
      border-radius: 2px;
      background: #4285f4;
      animation: wv .9s ease-in-out infinite;
    }
    .waves span:nth-child(1){ height:6px;  animation-delay:0s;   }
    .waves span:nth-child(2){ height:13px; animation-delay:.1s;  }
    .waves span:nth-child(3){ height:9px;  animation-delay:.2s;  }
    .waves span:nth-child(4){ height:15px; animation-delay:.3s;  }
    .waves span:nth-child(5){ height:5px;  animation-delay:.4s;  }
    @keyframes wv { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(.35)} }
    .waves.done span { animation: none; height: 3px !important; background: #444; }

    .no-transcript { color: #666; font-style: italic; font-size: 13px; }

    /* ── Input bar ─────────────────────────────────── */
    #input-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #141420;
      border-top: 1px solid #252540;
      flex-shrink: 0;
    }
    #msg-input {
      flex: 1;
      background: #0d0d1a;
      border: 1px solid #252540;
      border-radius: 22px;
      padding: 10px 18px;
      color: #e0e0e0;
      font-size: 14.5px;
      outline: none;
      transition: border-color .2s;
    }
    #msg-input:focus   { border-color: #4285f4; }
    #msg-input::placeholder { color: #444; }
    #msg-input:disabled { opacity: .4; cursor: not-allowed; }

    #send-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: none;
      background: #4285f4;
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .1s;
      flex-shrink: 0;
    }
    #send-btn:hover   { background: #5a95f5; }
    #send-btn:active  { transform: scale(.93); }
    #send-btn:disabled{ background: #2a2a3a; cursor: not-allowed; }
    #send-btn svg { width: 17px; height: 17px; fill: white; }
  </style>
</head>
<body>

<header>
  <div class="gem-logo"></div>
  <h1>Gemini Live</h1>
  <span class="model-tag" id="model-tag">…</span>
  <div class="status-pill">
    <div class="dot connecting" id="status-dot"></div>
    <span id="status-text">Connecting…</span>
  </div>
</header>

<div id="sign-panel">
  <video id="cam-video" autoplay playsinline muted></video>
  <div>
    <div class="sign-controls">
      <button id="toggle-cam-btn" class="sign-btn">Start Camera</button>
    </div>
    <div class="sign-text"><b>Recognized:</b> <span id="recognized-text">—</span></div>
    <div class="sign-text"><b>Live:</b> <span id="live-text">—</span></div>
    <div class="sign-text"><b>Gemini:</b> <span id="sign-gemini-text">—</span></div>
  </div>
</div>

<div id="chat"></div>

<div id="input-bar">
  <input id="msg-input" type="text" placeholder="Type a message and press Enter…" disabled autocomplete="off" />
  <button id="send-btn" disabled>
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<script>
  // ── DOM ──────────────────────────────────────────────────────────────────
  const chat      = document.getElementById('chat');
  const input     = document.getElementById('msg-input');
  const sendBtn   = document.getElementById('send-btn');
  const statusDot = document.getElementById('status-dot');
  const statusTxt = document.getElementById('status-text');
  const modelTag  = document.getElementById('model-tag');
  const camVideo  = document.getElementById('cam-video');
  const toggleCamBtn = document.getElementById('toggle-cam-btn');
  const recognizedTextEl = document.getElementById('recognized-text');
  const liveTextEl = document.getElementById('live-text');
  const signGeminiTextEl = document.getElementById('sign-gemini-text');

  // ── State ─────────────────────────────────────────────────────────────────
  let ws               = null;
  let signWs           = null;
  let curBubble        = null;   // current Gemini bubble element
  let activeTurn       = null;   // { bubble, waves, pending }
  let turnTimeout      = null;
  let cameraStream     = null;
  let frameTimer       = null;
  const frameCanvas    = document.createElement('canvas');
  frameCanvas.width = 320;
  frameCanvas.height = 240;
  const frameCtx = frameCanvas.getContext('2d');

  // ── Audio ─────────────────────────────────────────────────────────────────
  let audioCtx      = null;
  let nextStartTime = 0;

  function getAudioCtx() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function parseSampleRate(mime) {
    const m = mime.match(/rate=(\d+)/);
    return m ? parseInt(m[1], 10) : 24000;
  }

  function playPCMChunk(b64, mime, turnRef) {
    const ctx        = getAudioCtx();
    const sampleRate = parseSampleRate(mime);

    // base64 → Uint8Array
    const bin   = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

    // 16-bit signed little-endian PCM → Float32
    const i16 = new Int16Array(bytes.buffer);
    const f32 = new Float32Array(i16.length);
    for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;

    const buf = ctx.createBuffer(1, f32.length, sampleRate);
    buf.copyToChannel(f32, 0);

    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);

    const startAt  = Math.max(ctx.currentTime + 0.04, nextStartTime);
    src.start(startAt);
    nextStartTime = startAt + buf.duration;

    if (!turnRef) return;
    turnRef.pending++;
    src.onended = () => {
      turnRef.pending = Math.max(0, turnRef.pending - 1);
      if (turnRef.pending === 0 && turnRef.waves) turnRef.waves.classList.add('done');
    };
  }

  // ── Chat helpers ──────────────────────────────────────────────────────────
  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function scrollDown() { chat.scrollTop = chat.scrollHeight; }

  function addUserMessage(text) {
    const el = document.createElement('div');
    el.className = 'msg user';
    el.innerHTML = `<div class="avatar">U</div><div class="bubble">${esc(text)}</div>`;
    chat.appendChild(el);
    scrollDown();
  }

  function addGeminiMessage(text) {
    const el = document.createElement('div');
    el.className = 'msg gemini';
    el.innerHTML = `<div class="avatar">G</div><div class="bubble">${esc(text)}</div>`;
    chat.appendChild(el);
    scrollDown();
  }

  function beginGeminiTurn() {
    curBubble     = null;
    nextStartTime = 0;   // reset audio clock for new turn

    const el     = document.createElement('div');
    el.className = 'msg gemini';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    bubble.appendChild(typing);

    el.innerHTML = `<div class="avatar">G</div>`;
    el.appendChild(bubble);
    chat.appendChild(el);
    scrollDown();

    curBubble = bubble;
    activeTurn = { bubble, waves: null, pending: 0 };

    if (turnTimeout) clearTimeout(turnTimeout);
    turnTimeout = setTimeout(() => {
      finishGeminiTurn();
      setInputEnabled(true);
    }, 30000);
  }

  function appendTranscription(text) {
    if (!curBubble) return;
    // Remove typing indicator on first content
    const typing = curBubble.querySelector('.typing');
    if (typing) typing.remove();

    let span = curBubble.querySelector('.transcript');
    if (!span) {
      span = document.createElement('span');
      span.className = 'transcript';
      // Insert before audio-row if it exists
      const ar = curBubble.querySelector('.audio-row');
      ar ? curBubble.insertBefore(span, ar) : curBubble.appendChild(span);
    }
    span.textContent += text;
    scrollDown();
  }

  function attachAudioRow() {
    if (!curBubble || !activeTurn || activeTurn.waves) return;
    const row = document.createElement('div');
    row.className = 'audio-row';
    row.innerHTML = `
      <span class="icon">🔊</span>
      <div class="waves"><span></span><span></span><span></span><span></span><span></span></div>
      <span class="audio-label">Playing…</span>
    `;
    curBubble.appendChild(row);
    activeTurn.waves = row.querySelector('.waves');
  }

  function finishGeminiTurn() {
    if (!curBubble) return;
    if (turnTimeout) {
      clearTimeout(turnTimeout);
      turnTimeout = null;
    }
    if (activeTurn && activeTurn.pending === 0 && activeTurn.waves) {
      activeTurn.waves.classList.add('done');
    }
    const typing = curBubble.querySelector('.typing');
    if (typing) {
      typing.remove();
      if (!curBubble.querySelector('.transcript') && !curBubble.querySelector('.audio-row')) {
        const nt = document.createElement('span');
        nt.className = 'no-transcript';
        nt.textContent = '(no transcription received)';
        curBubble.appendChild(nt);
      }
    }
    curBubble = null;
    activeTurn = null;
    scrollDown();
  }

  // ── Status ────────────────────────────────────────────────────────────────
  function setStatus(state, text) {
    statusDot.className = 'dot ' + state;
    statusTxt.textContent = text;
  }

  function setInputEnabled(on) {
    input.disabled  = !on;
    sendBtn.disabled = !on;
    if (on) input.focus();
  }

  // ── WebSocket ─────────────────────────────────────────────────────────────
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);

    ws.onopen = () => setStatus('connecting', 'Connecting to Gemini…');

    ws.onmessage = ({ data }) => {
      const msg = JSON.parse(data);

      if (msg.type === 'ready') {
        setStatus('connected', 'Connected');
        modelTag.textContent = (msg.model || '').replace('models/', '');
        setInputEnabled(true);
      }
      else if (msg.type === 'transcription') {
        appendTranscription(msg.text);
      }
      else if (msg.type === 'audio') {
        attachAudioRow();
        playPCMChunk(msg.data, msg.mime || 'audio/pcm;rate=24000', activeTurn);
      }
      else if (msg.type === 'turn_complete') {
        finishGeminiTurn();
        setInputEnabled(true);
      }
      else if (msg.type === 'error') {
        finishGeminiTurn();
        const e = document.createElement('div');
        e.style.cssText = 'color:#ea4335;font-size:13px;padding:6px 20px;';
        e.textContent = '⚠ ' + msg.message;
        chat.appendChild(e);
        setInputEnabled(true);
      }
    };

    ws.onclose = () => {
      setStatus('error', 'Disconnected — reload to reconnect');
      setInputEnabled(false);
    };

    ws.onerror = () => setStatus('error', 'Connection error');
  }

  // ── Send ──────────────────────────────────────────────────────────────────
  function send() {
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    addUserMessage(text);
    input.value = '';
    setInputEnabled(false);
    beginGeminiTurn();
    ws.send(JSON.stringify({ text }));
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // ── Sign pipeline (webcam + ws-sign) ─────────────────────────────────────
  async function startCamera() {
    if (cameraStream) return;
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
      camVideo.srcObject = cameraStream;
      toggleCamBtn.textContent = 'Stop Camera';
      connectSignPipeline();
    } catch (e) {
      recognizedTextEl.textContent = 'Camera permission denied or unavailable.';
      liveTextEl.textContent = '—';
    }
  }

  function stopCamera() {
    if (!cameraStream) return;
    stopSignPipeline();
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
    camVideo.srcObject = null;
    toggleCamBtn.textContent = 'Start Camera';
    recognizedTextEl.textContent = '—';
    liveTextEl.textContent = '—';
    signGeminiTextEl.textContent = '—';
  }

  function connectSignPipeline() {
    if (!cameraStream || signWs) return;

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    signWs = new WebSocket(`${proto}//${location.host}/ws-sign`);

    signWs.onopen = () => {
      recognizedTextEl.textContent = 'Streaming…';
      liveTextEl.textContent = 'Listening…';
      signGeminiTextEl.textContent = 'Waiting…';

      frameTimer = setInterval(() => {
        if (!signWs || signWs.readyState !== WebSocket.OPEN || !cameraStream) return;
        frameCtx.drawImage(camVideo, 0, 0, frameCanvas.width, frameCanvas.height);
        const dataUrl = frameCanvas.toDataURL('image/jpeg', 0.65);
        const b64 = dataUrl.split(',')[1] || '';
        signWs.send(JSON.stringify({ type: 'frame', frame: b64 }));
      }, 100);
    };

    signWs.onmessage = ({ data }) => {
      const msg = JSON.parse(data);
      if (msg.type === 'recognized_text') {
        recognizedTextEl.textContent = msg.text || '—';
        liveTextEl.textContent = msg.text || '—';
      } else if (msg.type === 'live_text') {
        liveTextEl.textContent = msg.text || '—';
      } else if (msg.type === 'gemini_text') {
        signGeminiTextEl.textContent = msg.text || '—';
        addGeminiMessage(msg.text || '');
      } else if (msg.type === 'audio') {
        playPCMChunk(msg.data, msg.mime || 'audio/pcm;rate=24000', null);
      } else if (msg.type === 'error') {
        signGeminiTextEl.textContent = 'Error: ' + (msg.message || 'Unknown');
      }
    };

    signWs.onclose = () => {
      if (frameTimer) {
        clearInterval(frameTimer);
        frameTimer = null;
      }
      signWs = null;
      // If camera is still on, reconnect automatically for natural UX.
      if (cameraStream) {
        recognizedTextEl.textContent = 'Reconnecting…';
        liveTextEl.textContent = 'Reconnecting…';
        setTimeout(() => {
          if (cameraStream && !signWs) connectSignPipeline();
        }, 400);
      }
    };
  }

  function stopSignPipeline() {
    if (frameTimer) {
      clearInterval(frameTimer);
      frameTimer = null;
    }
    if (signWs) {
      if (signWs.readyState === WebSocket.OPEN) signWs.send(JSON.stringify({ type: 'stop' }));
      signWs.close();
      signWs = null;
    }
  }

  toggleCamBtn.addEventListener('click', () => {
    if (cameraStream) stopCamera();
    else startCamera();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopSignPipeline();
    } else if (cameraStream && !signWs) {
      connectSignPipeline();
    }
  });

  window.addEventListener('beforeunload', () => {
    stopSignPipeline();
    stopCamera();
  });

  // ── Boot ──────────────────────────────────────────────────────────────────
  connect();
</script>
</body>
</html>
